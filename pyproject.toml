[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "county-health-normalize"
version = "1.0.0"
description = "Age-adjust county rates and suppress small cells before a rate is published."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TechieGoku2623" }]
dependencies = []

[project.optional-dependencies]
dev = ["black==24.8.0", "flake8==7.1.1"]

[project.scripts]
county-health-normalize = "county_health_normalize.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
